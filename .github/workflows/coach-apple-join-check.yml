name: Coach Apple web invitation safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'coach-join.html'
      - '.github/workflows/coach-apple-join-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check embedded invitation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('coach-join.html').read_text()
          matches=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          assert matches, 'embedded script missing'
          Path('/tmp/coach-apple-join.js').write_text('\n'.join(matches))
          PY
          node --check /tmp/coach-apple-join.js
      - name: Confirm Apple only links existing identity with explicit consent
        run: |
          grep -q 'id="appleLogin"' coach-join.html
          grep -q '/v1/session/apple/existing' coach-join.html
          grep -q 'apple-account-match-confirm' coach-join.html
          grep -q 'confirmAccountId:signedInUser.id' coach-join.html
          grep -q 'clientId:appleWebConfig.clientId' coach-join.html
