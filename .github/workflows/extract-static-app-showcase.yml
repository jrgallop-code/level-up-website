name: Extract static app showcase

on:
  push:
    branches:
      - agent/static-real-app-showcase
    paths:
      - .github/workflows/extract-static-app-showcase.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/extract-static-app-showcase.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/static-real-app-showcase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract real app frames
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          import base64
          import io
          import pathlib
          import subprocess
          from PIL import Image

          source_commit = 'faf97a5f6bd05c24bd78530df689b5b588c6e33a'
          encoded = []
          for index in range(10):
              path = f'assets/app-demo/part-{index:02d}.txt'
              encoded.append(subprocess.check_output(['git', 'show', f'{source_commit}:{path}'], text=True).strip())

          raw = base64.b64decode(''.join(encoded))
          image = Image.open(io.BytesIO(raw))
          targets = {
              0: 'dashboard.png',
              1: 'progress.png',
              5: 'recovery.png',
              7: 'smart-build.png',
          }
          output = pathlib.Path('assets/app-showcase')
          output.mkdir(parents=True, exist_ok=True)

          for frame_index, filename in targets.items():
              image.seek(frame_index)
              frame = image.convert('RGB')
              frame = frame.resize((frame.width * 4, frame.height * 4), Image.Resampling.LANCZOS)
              frame.save(output / filename, 'PNG', compress_level=4)
              print(filename, frame.size)
          PY

      - name: Commit extracted screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-showcase/*.png
          git diff --cached --quiet && exit 0
          git commit -m "Add static real-app showcase screenshots"
          git push origin HEAD:agent/static-real-app-showcase
